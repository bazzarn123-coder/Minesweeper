<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin: 0 0 10px 0;
      color: #38bdf8;
      font-size: 26px;
      letter-spacing: 2px;
    }
    .game-container {
      background-color: #1e293b;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .counter {
      font-family: monospace;
      font-size: 20px;
      font-weight: bold;
      color: #ef4444;
      background-color: #000;
      padding: 4px 8px;
      border-radius: 4px;
      min-width: 50px;
      text-align: center;
    }
    .face-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 32px);
      grid-template-rows: repeat(9, 32px);
      gap: 3px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background-color: #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.1);
    }
    .cell.revealed {
      background-color: #0f172a;
      box-shadow: none;
    }
    .cell.mine {
      background-color: #dc2626;
    }
    /* Number Colors */
    .c-1 { color: #38bdf8; }
    .c-2 { color: #22c55e; }
    .c-3 { color: #ef4444; }
    .c-4 { color: #a855f7; }
    .c-5 { color: #f59e0b; }
    .c-6 { color: #06b6d4; }
    .c-7 { color: #ec4899; }
    .c-8 { color: #f43f5e; }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      width: 100%;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #334155;
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .mode-btn.active {
      border-color: #38bdf8;
      color: #38bdf8;
      background-color: #1e293b;
    }
  </style>
</head>
<body>

  <h1>MINESWEEPER</h1>

  <div class="game-container">
    <div class="header">
      <div class="counter" id="mineCount">010</div>
      <button class="face-btn" id="faceBtn" onclick="initGame()">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="controls">
      <button class="mode-btn active" id="digBtn" onclick="setMode('dig')">⛏️ Dig</button>
      <button class="mode-btn" id="flagBtn" onclick="setMode('flag')">🚩 Flag</button>
    </div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    const gridEl = document.getElementById("grid");
    const mineCountEl = document.getElementById("mineCount");
    const timerEl = document.getElementById("timer");
    const faceBtn = document.getElementById("faceBtn");
    const digBtn = document.getElementById("digBtn");
    const flagBtn = document.getElementById("flagBtn");

    let board = [];
    let gameOver = false;
    let gameStarted = false;
    let mode = 'dig'; // 'dig' or 'flag'
    let flagsPlaced = 0;
    let timer = 0;
    let timerInterval = null;

    function setMode(newMode) {
      mode = newMode;
      digBtn.classList.toggle('active', mode === 'dig');
      flagBtn.classList.toggle('active', mode === 'flag');
    }

    function initGame() {
      clearInterval(timerInterval);
      timer = 0;
      flagsPlaced = 0;
      gameOver = false;
      gameStarted = false;
      faceBtn.textContent = "🙂";
      timerEl.textContent = "000";
      mineCountEl.textContent = String(MINES).padStart(3, '0');
      gridEl.innerHTML = "";
      board = [];

      // Create Board Grid
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          row.push({
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            count: 0
          });
        }
        board.push(row);
      }

      // Render Grid DOM
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cellEl = document.createElement("div");
          cellEl.classList.add("cell");
          cellEl.dataset.r = r;
          cellEl.dataset.c = c;
          cellEl.addEventListener("click", () => handleCellClick(r, c));
          cellEl.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          gridEl.appendChild(cellEl);
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timer++;
        if (timer <= 999) {
          timerEl.textContent = String(timer).padStart(3, '0');
        }
      }, 1000);
    }

    function placeMines(firstR, firstC) {
      let minesPlaced = 0;
      while (minesPlaced < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);

        // Don't place mine on first clicked cell or existing mine
        if ((r !== firstR || c !== firstC) && !board[r][c].isMine) {
          board[r][c].isMine = true;
          minesPlaced++;
        }
      }

      // Calculate Neighbor Counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].isMine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                count++;
              }
            }
          }
          board[r][c].count = count;
        }
      }
    }

    function handleCellClick(r, c) {
      if (gameOver) return;

      if (mode === 'flag') {
        toggleFlag(r, c);
        return;
      }

      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (!gameStarted) {
        gameStarted = true;
        placeMines(r, c);
        startTimer();
      }

      if (cell.isMine) {
        triggerGameOver(false);
        return;
      }

      revealCell(r, c);
      checkWinCondition();
    }

    function toggleFlag(r, c) {
      if (gameOver) return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      flagsPlaced += cell.flagged ? 1 : -1;

      const remainingMines = MINES - flagsPlaced;
      mineCountEl.textContent = String(Math.max(-99, remainingMines)).padStart(3, '0');

      const cellEl = getCellEl(r, c);
      cellEl.textContent = cell.flagged ? "🚩" : "";
    }

    function revealCell(r, c) {
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      const cellEl = getCellEl(r, c);
      cellEl.classList.add("revealed");

      if (cell.count > 0) {
        cellEl.textContent = cell.count;
        cellEl.classList.add(`c-${cell.count}`);
      } else {
        // Flood fill empty spaces
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(nr, nc);
            }
          }
        }
      }
    }

    function checkWinCondition() {
      let unrevealedNonMines = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine && !board[r][c].revealed) {
            unrevealedNonMines++;
          }
        }
      }

      if (unrevealedNonMines === 0) {
        triggerGameOver(true);
      }
    }

    function triggerGameOver(won) {
      gameOver = true;
      clearInterval(timerInterval);
      faceBtn.textContent = won ? "😎" : "😵";

      // Reveal all mines
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board[r][c];
          const cellEl = getCellEl(r, c);

          if (cell.isMine) {
            if (!won) cellEl.classList.add("mine");
            cellEl.textContent = "💣";
          }
        }
      }
    }

    function getCellEl(r, c) {
      return gridEl.children[r * COLS + c];
    }

    initGame();
  </script>
</body>
</html>
